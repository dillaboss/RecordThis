name: Build RecordThis

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: win-x64
            test: true
          - target: aarch64-pc-windows-msvc
            name: win-arm64
            test: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # DSP, spool, settings and export tests (they also run on Linux/macOS).
      - name: Test
        if: matrix.test
        run: cargo test --lib --target ${{ matrix.target }}

      - name: Build release EXE
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RecordThis-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/RecordThis.exe
